name: Hygrow Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait

      - name: Download APK
        run: |
          mkdir -p dist
          eas build:download \
            --platform android \
            --latest \
            --path dist/hygrow.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hygrow-android-apk
          path: dist/hygrow.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Hygrow Release v${{ github.run_number }}
          files: dist/hygrow.apk
          generate_release_notes: true
