name: Hygrow Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            --json > build.json

      - name: Extract build ID
        id: build_info
        run: |
          BUILD_ID=$(jq -r '.id // .[0].id' build.json)

          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "Could not find build ID"
            cat build.json
            exit 1
          fi

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

      - name: Download APK
        run: |
          mkdir -p dist
          cd dist
          eas build:download \
            --build-id "$BUILD_ID" \
            --non-interactive

          APK=$(find . -maxdepth 1 -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          mv "$APK" hygrow.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hygrow-android-apk
          path: dist/hygrow.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Hygrow Release v${{ github.run_number }}"
          files: dist/hygrow.apk
          generate_release_notes: true
