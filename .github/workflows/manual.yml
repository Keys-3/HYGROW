name: Hygrow Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install frontend dependencies
        working-directory: FrontEnd
        run: npm ci

      - name: Expo Prebuild
        working-directory: FrontEnd
        run: npx expo prebuild --platform android --clean

      - name: Build Android Release APK
        working-directory: FrontEnd/android
        run: ./gradlew assembleRelease

      - name: Prepare Artifact
        run: |
          mkdir -p dist
          cp FrontEnd/android/app/build/outputs/apk/release/app-release.apk dist/hygrow.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hygrow-android-apk
          path: dist/hygrow.apk

  build-ios:
    name: Build iOS Simulator App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: FrontEnd
        run: npm ci

      - name: Expo Prebuild
        working-directory: FrontEnd
        run: npx expo prebuild --platform ios --clean

      - name: Build iOS App
        working-directory: FrontEnd/ios
        run: |
          pod install
          xcodebuild -workspace HyGrow.xcworkspace -scheme HyGrow -configuration Release -sdk iphonesimulator -derivedDataPath build

      - name: Prepare Artifact
        run: |
          mkdir -p dist
          cd FrontEnd/ios/build/Build/Products/Release-iphonesimulator
          tar -czf ../../../../../../dist/hygrow-ios-simulator.tar.gz HyGrow.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hygrow-ios-simulator
          path: dist/hygrow-ios-simulator.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: hygrow-android-apk
          path: dist

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: hygrow-ios-simulator
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Hygrow Release v${{ github.run_number }}"
          files: |
            dist/hygrow.apk
            dist/hygrow-ios-simulator.tar.gz
          append_body: true
          generate_release_notes: true
