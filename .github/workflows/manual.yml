name: Hygrow Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build and Release ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [android]
        include:
          - platform: android
            file_ext: apk
            artifact_name: hygrow-android-apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install frontend dependencies
        working-directory: FrontEnd
        run: npm ci

      - name: Build with EAS
        working-directory: FrontEnd
        env:
          EAS_NO_VCS: 1
        run: |
          eas build \
            --platform ${{ matrix.platform }} \
            --profile production \
            --non-interactive \
            --wait \
            --json > ../build_${{ matrix.platform }}.json

      - name: Extract build ID
        id: build_info
        run: |
          BUILD_ID=$(jq -r '.id? // .[0]?.id?' build_${{ matrix.platform }}.json)

          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "Could not find build ID"
            cat build_${{ matrix.platform }}.json
            exit 1
          fi

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

      - name: Download App Binary
        working-directory: FrontEnd
        run: |
          mkdir -p ../dist
          
          eas build:download \
            --build-id "$BUILD_ID" \
            --non-interactive \
            --output ../dist/hygrow.${{ matrix.file_ext }}

          if [ ! -f "../dist/hygrow.${{ matrix.file_ext }}" ]; then
            echo "Binary not found"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/hygrow.${{ matrix.file_ext }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Hygrow Release v${{ github.run_number }}"
          files: dist/hygrow.${{ matrix.file_ext }}
          append_body: true
          generate_release_notes: true
